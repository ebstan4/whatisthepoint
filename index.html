<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>What do you think the point is?</title>
<style>
  :root{--maxw:740px}
  html,body{height:100%;margin:0;background:#fff;color:#111;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px;}
  .card{max-width:var(--maxw);width:100%;text-align:center;padding:30px 22px}
  h1{font-size:clamp(20px,4vw,36px);margin:0 0 18px;font-weight:600;letter-spacing:-0.02em}
  form{display:flex;gap:10px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:18px}
  input[type="text"]{flex:0 1 220px;padding:10px;border:1px solid #e6e6e6;border-radius:8px;font-size:15px}
  textarea{flex:1 1 380px;padding:12px;border:1px solid #e6e6e6;border-radius:8px;font-size:15px;min-height:72px;resize:vertical}
  .controls{width:100%;display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px}
  .btn{background:#111;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}
  .small{font-size:13px;color:#666;margin-top:12px}
  .muted{color:#999;font-size:12px;margin-top:8px}
  .selected-box{margin-top:28px;padding:12px;border-radius:8px;background:#fafafa;border:1px solid #f0f0f0;max-width:720px;margin-left:auto;margin-right:auto}
  .meta{font-size:13px;color:#666;margin-bottom:6px}
  .tiny{font-size:12px;color:#999}
  label.inline{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
  @media (max-width:520px){ textarea{min-height:90px} input[type="text"]{flex-basis:100%} .controls{flex-direction:column} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main">
      <h1>What do you think the point is?</h1>

      <form id="form" onsubmit="return false;" aria-label="submit response">
        <input id="name" type="text" placeholder="name (optional)" maxlength="50" autocomplete="off"/>
        <textarea id="message" placeholder="your message" maxlength="700" required></textarea>

        <div class="controls" style="margin-top:12px">
          <label class="inline">
            <input id="mayPublish" type="checkbox" />
            <span>🦝 A raccoon says it's okay if you publish this</span>
          </label>

          <button id="send" class="btn" type="button">Send</button>
        </div>
      </form>

      <div class="small">No signup. No tracking. Submissions go to a private inbox and only curated replies are shown below.</div>

      <div class="muted tiny" style="margin-top:18px">If you'd like to be invisible: use a throwaway name. We remove messages that break the rules.</div>

      <!-- curated selected list (only this is public) -->
      <div class="selected-box" id="selectedBox" style="display:none;">
        <strong>Selected responses</strong>
        <div id="selectedList"></div>
      </div>

    </div>
  </div>

  <!-- Firebase compat CDN (works in plain HTML pages) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
  // ===== YOUR FIREBASE CONFIG =====
  const firebaseConfig = {
    apiKey: "AIzaSyCI8mpFl8YlS5DiN-hBmQ82SMwKW_-s-a8",
    authDomain: "whatisthepoint-bf1c4.firebaseapp.com",
    databaseURL: "https://whatisthepoint-bf1c4-default-rtdb.firebaseio.com",
    projectId: "whatisthepoint-bf1c4",
    storageBucket: "whatisthepoint-bf1c4.firebasestorage.app",
    messagingSenderId: "846595538481",
    appId: "1:846595538481:web:2bfd56678a51e67f075f10"
  };
  // ================================

  // initialize firebase (compat)
  firebase.initializeApp(firebaseConfig);

  // helpers & refs
  function escapeHtml(s){
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').trim();
  }

  const db = firebase.database();
  const messagesRef = db.ref('messages');   // all submissions (private inbox)
  const selectedRef = db.ref('selected');   // curated public items

  const elName = document.getElementById('name');
  const elMsg = document.getElementById('message');
  const elSend = document.getElementById('send');
  const elMay = document.getElementById('mayPublish');
  const selectedBox = document.getElementById('selectedBox');
  const selectedList = document.getElementById('selectedList');

  // store submission only
  async function pushMessage(name, text, mayPublish){
    const data = {
      name: escapeHtml(name).substring(0,50) || 'anonymous',
      text: escapeHtml(text).substring(0,700),
      mayPublish: !!mayPublish,
      t: Date.now()
    };
    return messagesRef.push(data);
  }

  function simpleCheck(text){
    if(!text || !text.trim()) return 'empty';
    if(text.length > 700) return 'too_long';
    if(/[!?.]{40,}/.test(text)) return 'spam';
    return null;
  }

  elSend.addEventListener('click', async ()=>{
    const name = elName.value;
    const text = elMsg.value;
    const may = elMay.checked;
    const ck = simpleCheck(text);
    if(ck){
      alert({empty:'Type a message', too_long:'Message too long', spam:'Please be less spammy'}[ck] || 'Invalid');
      return;
    }
    elSend.disabled = true;
    try{
      await pushMessage(name, text, may);
      elMsg.value = '';
      elMay.checked = false;
      // subtle confirmation text for user
      elSend.textContent = 'Noted';
      setTimeout(()=> elSend.textContent = 'Send', 1200);
    }catch(e){
      console.error(e);
      alert('Send failed — try again');
    } finally {
      elSend.disabled = false;
    }
  });

  // ONLY read & show curated items from `selected/`
  selectedRef.on('value', snap=>{
    const obj = snap.val() || {};
    const items = Object.entries(obj).sort((a,b)=>a[1].t - b[1].t);

    if(items.length){
      selectedBox.style.display = 'block';
      selectedList.innerHTML = items.map(([k,v])=>{
        const date = v.t ? new Date(v.t).toLocaleString() : '';
        return `
          <div style="padding:12px 0;border-bottom:1px dashed #f7f7f7">
            <div class="meta"><strong>${v.name}</strong>${date ? ' • ' + date : ''}</div>
            <div>${v.text}</div>
          </div>
        `;
      }).join('');
    } else {
      selectedBox.style.display = 'none';
      selectedList.innerHTML = '';
    }
  });

  </script>
</body>
</html>
