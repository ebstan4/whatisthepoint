<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>what do you think the point is?</title>

<style>
  /* global: web1.0 y2k feel */
  html,body{
    height:100%;
    margin:0;
    font-family: "Times New Roman", Times, serif;
    background:
      /* subtle retro grid + paper */
      linear-gradient(180deg, #f6f8ff 0%, #f0f4ff 50%, #eef2ff 100%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 24px);
    color:#111;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    /* force lowercase everywhere */
    text-transform: lowercase;
  }

  /* centered white panel width ~3/5 of viewport */
  .frame {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 18px;
  }
  .panel {
    width:60vw; /* 3/5 of the screen */
    min-width:320px;
    max-width:960px;
    background: #ffffff;
    border: 6px solid #000; /* chunky old-school border */
    padding:28px 32px;
    box-shadow:
      8px 8px 0 0 rgba(0,0,0,0.06),
      -6px -6px 0 0 rgba(255,255,255,0.6) inset;
  }

  h1{
    margin:0 0 18px;
    font-size: clamp(20px, 3.5vw, 40px);
    text-align:center;
    letter-spacing: -0.01em;
  }

  form {
    display:flex;
    gap:12px;
    align-items:flex-start;
    justify-content:flex-start;
    flex-wrap:wrap;
    margin-top:14px;
  }

  .username {
    flex: 0 0 28%;
    min-width:150px;
  }

  .username input{
    width:100%;
    box-sizing:border-box;
    padding:10px 8px;
    font-family: "Times New Roman", Times, serif;
    font-size:15px;
    border:3px inset #ddd;
    background:#fffbe6;
    outline:none;
  }

  .message {
    flex: 1 1 66%;
    min-width:220px;
  }

  textarea#message{
    width:100%;
    min-height:90px;
    padding:12px 10px;
    font-family:"Times New Roman", Times, serif;
    resize:vertical;
    border:3px inset #ddd;
    background:#fffdf5;
    font-size:15px;
    line-height:1.25;
  }

  .controls {
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:10px;
  }

  .checkbox-label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    font-size:14px;
    color:#222;
  }

  /* retro checkbox look */
  input[type="checkbox"]{
    width:16px;
    height:16px;
    margin:0;
    accent-color:#222;
    transform:translateY(-1px);
  }

  button#send{
    background:#000;
    color:#fff;
    border:none;
    padding:8px 14px;
    font-weight:700;
    font-family:"Times New Roman", Times, serif;
    cursor:pointer;
    border-radius:4px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }

  .note{
    margin-top:12px;
    font-size:13px;
    color:#666;
  }

  .selected-box {
    margin-top:26px;
    padding:14px;
    border-radius:6px;
    background:#fbfbfb;
    border:2px solid #e0e0e0;
  }

  .selected-title{
    text-align:center;
    font-weight:700;
    margin-bottom:8px;
  }

  .selected-item{
    padding:10px 6px;
    border-top:1px dashed #e7e7e7;
    font-size:15px;
  }

  .meta { color:#666; font-size:13px; margin-bottom:6px; }

  /* make the tiny UI elements feel retro (lowercase, small) */
  ::placeholder { color:#9a9a9a; opacity:1; font-style:italic; }
  label, input, textarea, button { text-transform:lowercase; }

  @media (max-width:720px){
    .panel { width:92vw; padding:18px; }
    .username { flex-basis:100%; }
    .message { flex-basis:100%; }
    form { gap:8px; }
  }
</style>
</head>
<body>
  <div class="frame">
    <main class="panel" role="main" aria-labelledby="title">
      <h1 id="title">what do you think the point is?</h1>

      <form id="form" onsubmit="return false;" aria-label="submit response">
        <div class="username">
          <input id="username" type="text" placeholder="username (optional)" maxlength="50" autocomplete="off" />
        </div>

        <div class="message">
          <textarea id="message" placeholder="your message" maxlength="700" required></textarea>
        </div>

        <div class="controls" style="justify-content:flex-start">
          <label class="checkbox-label" id="checkboxLabel">
            <input id="mayPublish" type="checkbox" />
            <span id="checkboxText">🦝 a raccoon says it's okay if you publish this</span>
          </label>

          <button id="send" type="button">send</button>
        </div>
      </form>

      <div class="note">no signup. no tracking. submissions go to a private inbox and only curated replies are shown below.</div>
      <div class="note" style="margin-top:6px">if you'd like to be invisible: use a throwaway username.</div>

      <!-- curated public area (only 'selected' node appears) -->
      <div class="selected-box" id="selectedBox" style="display:none;">
        <div class="selected-title">selected responses</div>
        <div id="selectedList"></div>
      </div>
    </main>
  </div>

  <!-- firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
  // ===== FIREBASE CONFIG - keep your config here (already used previously) =====
  const firebaseConfig = {
    apiKey: "AIzaSyCI8mpFl8YlS5DiN-hBmQ82SMwKW_-s-a8",
    authDomain: "whatisthepoint-bf1c4.firebaseapp.com",
    databaseURL: "https://whatisthepoint-bf1c4-default-rtdb.firebaseio.com",
    projectId: "whatisthepoint-bf1c4",
    storageBucket: "whatisthepoint-bf1c4.firebasestorage.app",
    messagingSenderId: "846595538481",
    appId: "1:846595538481:web:2bfd56678a51e67f075f10"
  };
  // =============================================================================

  // init firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const messagesRef = db.ref('messages'); // private inbox
  const selectedRef = db.ref('selected'); // curated public

  // ui
  const usernameEl = document.getElementById('username');
  const messageEl  = document.getElementById('message');
  const sendBtn     = document.getElementById('send');
  const mayPublish  = document.getElementById('mayPublish');
  const checkboxText = document.getElementById('checkboxText');
  const selectedBox = document.getElementById('selectedBox');
  const selectedList = document.getElementById('selectedList');

  // dynamic checkbox text in lowercase
  function updateCheckboxText(){
    if(mayPublish.checked){
      checkboxText.textContent = "i'm okay if this gets chosen to be shown publicly";
    } else {
      checkboxText.textContent = "🦝 a raccoon says it's okay if you publish this";
    }
  }
  mayPublish.addEventListener('change', updateCheckboxText);
  updateCheckboxText();

  // small helper
  function escapeHtml(s){
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').trim();
  }

  function simpleCheck(text){
    if(!text || !text.trim()) return 'empty';
    if(text.length > 700) return 'too_long';
    if(/[!?.]{40,}/.test(text)) return 'spam';
    return null;
  }

  async function pushMessage(name, text, may){
    const data = {
      name: escapeHtml(name).substring(0,50) || 'anonymous',
      text: escapeHtml(text).substring(0,700),
      mayPublish: !!may,
      t: Date.now()
    };
    return messagesRef.push(data);
  }

  sendBtn.addEventListener('click', async ()=>{
    const name = usernameEl.value;
    const text = messageEl.value;
    const may = mayPublish.checked;
    const ck = simpleCheck(text);
    if(ck){
      alert({empty:'type a message', too_long:'message too long', spam:'please be less spammy'}[ck] || 'invalid');
      return;
    }
    sendBtn.disabled = true;
    try{
      await pushMessage(name, text, may);
      messageEl.value = '';
      mayPublish.checked = false;
      updateCheckboxText();
      sendBtn.textContent = 'noted';
      setTimeout(()=> sendBtn.textContent = 'send', 1000);
    }catch(e){
      console.error(e);
      alert('send failed — try again');
    }finally{
      sendBtn.disabled = false;
    }
  });

  // only read curated items
  selectedRef.on('value', snap=>{
    const obj = snap.val() || {};
    const items = Object.entries(obj).sort((a,b)=>a[1].t - b[1].t);

    if(items.length){
      selectedBox.style.display = 'block';
      selectedList.innerHTML = items.map(([k,v])=>{
        const date = v.t ? new Date(v.t).toLocaleString() : '';
        return `
          <div class="selected-item">
            <div class="meta"><strong>${v.name}</strong>${date ? ' • ' + date : ''}</div>
            <div>${v.text}</div>
          </div>
        `;
      }).join('');
    } else {
      selectedBox.style.display = 'none';
      selectedList.innerHTML = '';
    }
  });

  </script>
</body>
</html>
