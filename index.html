<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>what do you think the point is?</title>

<style>
  /* global: web1.0 y2k feel */
  html,body{
    height:100%;
    margin:0;
    font-family: "Times New Roman", Times, serif;
    /* default local fallback background (used if NASA fetch fails or before it loads) */
    background-image: url("AoWXgnHSxAAPxqymPQMQYL-1200-80.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color:#111;
    text-transform: lowercase;
  }

  /* centered white panel width ~3/5 of viewport */
  .frame {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 18px;
  }
  .panel {
    width:40vw;
    min-width:320px;
    max-width:960px;
    background: rgba(255,255,255,0.95);
    border: 6px solid #000;
    padding:28px 32px;
    box-shadow:
      0 0 30px rgba(0,0,0,0.6),
      8px 8px 0 rgba(0,0,0,0.2);
  }

  h1{
    margin:0 0 12px;
    font-size: clamp(20px, 3.5vw, 40px);
    text-align:center;
    letter-spacing: -0.01em;
  }

  /* VERTICAL form layout */
  form {
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:14px;
  }

  .username {
    width:100%;
  }

  .username input{
    width:100%;
    box-sizing:border-box;
    padding:10px 8px;
    font-family: "Times New Roman", Times, serif;
    font-size:15px;
    border:3px inset #ddd;
    background:#fffbe6;
    outline:none;
  }

  .message {
    width:100%;
  }

  textarea#message{
    width:100%;
    min-height:160px;
    padding:12px 10px;
    font-family:"Times New Roman", Times, serif;
    resize:vertical;
    border:3px inset #ddd;
    background:#fffdf5;
    font-size:15px;
    line-height:1.25;
  }

  .controls {
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:6px;
  }

  .checkbox-label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    font-size:14px;
    color:#222;
  }

  input[type="checkbox"]{
    width:16px;
    height:16px;
    margin:0;
    accent-color:#222;
    transform:translateY(-1px);
  }

  button#send{
    background:#000;
    color:#fff;
    border:none;
    padding:8px 14px;
    font-weight:700;
    font-family:"Times New Roman", Times, serif;
    cursor:pointer;
    border-radius:4px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }

  /* minimal: only things on page */
  .selected-box {
    margin-top:26px;
    padding:14px;
    border-radius:6px;
    background:#fbfbfb;
    border:2px solid #e0e0e0;
  }

  .selected-title{
    text-align:center;
    font-weight:700;
    margin-bottom:8px;
  }

  .selected-item{
    padding:10px 6px;
    border-top:1px dashed #e7e7e7;
    font-size:15px;
  }

  .meta { color:#666; font-size:13px; margin-bottom:6px; }

  /* after submit confirmation */
  #afterSubmit {
    margin-top:20px;
    text-align:center;
    padding:12px;
    border:2px solid #e7e7e7;
    background:#fffdf8;
    font-size:15px;
  }
  #afterSubmit p { margin:6px 0; color:#333; }

  .linkish {
    color:#000;
    text-decoration:underline;
    cursor:pointer;
    font-weight:700;
  }

  /* footer established date */
  .established {
    margin-top:18px;
    text-align:center;
    font-size:13px;
    color:#444;
  }

  /* credit badge for NASA image (small, unobtrusive) */
  #nasaCredit {
    position: fixed;
    left: 10px;
    bottom: 8px;
    background: rgba(0,0,0,0.45);
    color: #fff;
    padding: 6px 8px;
    font-size: 12px;
    border-radius: 4px;
    text-decoration: none;
    z-index: 9999;
    backdrop-filter: blur(2px);
  }
  #nasaCredit:hover { opacity: 0.95; }

  /* placeholders, lowercase enforcement */
  ::placeholder { color:#9a9a9a; opacity:1; font-style:italic; }
  label, input, textarea, button { text-transform:lowercase; }

  @media (max-width:720px){
    .panel { width:92vw; padding:18px; }
    form { gap:10px; }
    #nasaCredit { left:6px; right:6px; font-size:11px; text-align:center; }
  }
</style>
</head>
<body>
  <div class="frame">
    <main class="panel" role="main" aria-labelledby="title">
      <h1 id="title">what do you think the point is?</h1>

      <form id="form" onsubmit="return false;" aria-label="submit response">
        <div class="username">
          <input id="username" type="text" placeholder="username" maxlength="50" autocomplete="off" />
        </div>

        <div class="message">
          <textarea id="message" placeholder="your message" maxlength="700" required></textarea>
        </div>

        <div class="controls">
          <label class="checkbox-label">
            <input id="mayPublish" type="checkbox" />
            <span id="checkboxText">i am okay with having my message be public</span>
          </label>

          <button id="send" type="button">send</button>
        </div>
      </form>

      <div id="afterSubmit" style="display:none;">
        <p>your message has been received.</p>
        <p style="color:#555">it may or may not be chosen.</p>
        <p style="margin-top:12px;"><span id="submitAgain" class="linkish">submit another thought</span></p>
      </div>

      <!-- curated public area (only 'selected' node appears) -->
      <div class="selected-box" id="selectedBox" style="display:none;">
        <div class="selected-title">selected responses</div>
        <div id="selectedList"></div>
      </div>

      <div class="established">Online Since: Feb 21, 2026, 2:34 AM (Made in California)</div>
    </main>
  </div>

  <!-- small credit anchor (populated by script) -->
  <a id="nasaCredit" href="#" target="_blank" rel="noopener noreferrer" style="display:none;"></a>

  <!-- firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
  // ===== FIREBASE CONFIG - keep your config here (already used previously) =====
  const firebaseConfig = {
    apiKey: "AIzaSyCI8mpFl8YlS5DiN-hBmQ82SMwKW_-s-a8",
    authDomain: "whatisthepoint-bf1c4.firebaseapp.com",
    databaseURL: "https://whatisthepoint-bf1c4-default-rtdb.firebaseio.com",
    projectId: "whatisthepoint-bf1c4",
    storageBucket: "whatisthepoint-bf1c4.firebasestorage.app",
    messagingSenderId: "846595538481",
    appId: "1:846595538481:web:2bfd56678a51e67f075f10"
  };
  // =============================================================================

  // init firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const messagesRef = db.ref('messages'); // private inbox
  const selectedRef = db.ref('selected'); // curated public

  // ui
  const usernameEl = document.getElementById('username');
  const messageEl  = document.getElementById('message');
  const sendBtn     = document.getElementById('send');
  const mayPublish  = document.getElementById('mayPublish');
  const checkboxText = document.getElementById('checkboxText');
  const selectedBox = document.getElementById('selectedBox');
  const selectedList = document.getElementById('selectedList');
  const formEl = document.getElementById('form');
  const afterSubmit = document.getElementById('afterSubmit');
  const submitAgain = document.getElementById('submitAgain');

  // checkbox text (already static but kept for possible future changes)
  function updateCheckboxText(){ /* placeholder if you want dynamic text later */ }
  mayPublish.addEventListener('change', updateCheckboxText);

  // small helper
  function escapeHtml(s){
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').trim();
  }

  function simpleCheck(text){
    if(!text || !text.trim()) return 'empty';
    if(text.length > 700) return 'too_long';
    if(/[!?.]{40,}/.test(text)) return 'spam';
    return null;
  }

  async function pushMessage(name, text, may){
    const data = {
      name: escapeHtml(name).substring(0,50) || 'anonymous',
      text: escapeHtml(text).substring(0,700),
      mayPublish: !!may,
      t: Date.now()
    };
    return messagesRef.push(data);
  }

  function showAfterSubmit(){
    formEl.style.display = 'none';
    afterSubmit.style.display = 'block';
  }

  function restoreForm(){
    afterSubmit.style.display = 'none';
    formEl.style.display = 'flex';
    // reset small bits
    messageEl.value = '';
    usernameEl.value = '';
    mayPublish.checked = false;
    sendBtn.textContent = 'send';
  }

  sendBtn.addEventListener('click', async ()=>{
    const name = usernameEl.value;
    const text = messageEl.value;
    const may = mayPublish.checked;
    const ck = simpleCheck(text);
    if(ck){
      alert({empty:'type a message', too_long:'message too long', spam:'please be less spammy'}[ck] || 'invalid');
      return;
    }
    sendBtn.disabled = true;
    try{
      await pushMessage(name, text, may);
      // show the after-submit confirmation and hide the form
      showAfterSubmit();
    }catch(e){
      console.error(e);
      alert('send failed — try again');
    }finally{
      sendBtn.disabled = false;
    }
  });

  // allow people to submit again without a full page reload
  submitAgain.addEventListener('click', (e)=>{
    e.preventDefault();
    restoreForm();
  });

  // only read curated items
  selectedRef.on('value', snap=>{
    const obj = snap.val() || {};
    const items = Object.entries(obj).sort((a,b)=>a[1].t - b[1].t);

    if(items.length){
      selectedBox.style.display = 'block';
      selectedList.innerHTML = items.map(([k,v])=>{
        const date = v.t ? new Date(v.t).toLocaleString() : '';
        return `
          <div class="selected-item">
            <div class="meta"><strong>${v.name}</strong>${date ? ' • ' + date : ''}</div>
            <div>${v.text}</div>
          </div>
        `;
      }).join('');
    } else {
      selectedBox.style.display = 'none';
      selectedList.innerHTML = '';
    }
  });

  /****************************************************************
   * NASA random background integration (with caching & fallback)
   ****************************************************************/

  (function(){
    const CACHE_KEY = 'nasa_bg_cache_v1';
    const CACHE_TTL_MS = 1000 * 60 * 60 * 6; // 6 hours

    // helper: safe JSON parse
    function tryParse(s){
      try { return JSON.parse(s); } catch(e){ return null; }
    }

    // choose a large image from the asset list
    function chooseBestImageFromAssets(assets){
      // filter for images only
      const imgs = assets.filter(a => a.href && /\.(jpe?g|png|webp)$/i.test(a.href));
      if(!imgs.length) return null;
      // prefer files that include 'orig' or 'large' in the url if present
      let preferred = imgs.find(i => /orig|large|hi-res|hi_res|hires/i.test(i.href));
      if(preferred) return preferred.href;
      // otherwise take the last (usually the biggest)
      return imgs[imgs.length - 1].href;
    }

    // fetch random nasa image metadata and url
    async function fetchRandomNasaImage(){
      // Build a search query biased to beautiful space imagery
      const query = encodeURIComponent('nebula OR galaxy OR "deep field" OR nebula OR "hubble" OR "jwst" OR "planet"');
      // pick a random page between 1..5 to increase variance (API uses pages of results)
      const page = Math.floor(Math.random()*5) + 1;
      const searchUrl = `https://images-api.nasa.gov/search?q=${query}&media_type=image&page=${page}`;

      const s = await fetch(searchUrl);
      if(!s.ok) throw new Error('search failed');
      const sj = await s.json();
      const items = sj.collection && sj.collection.items ? sj.collection.items : [];
      if(!items.length) throw new Error('no results');

      // pick random item
      const item = items[Math.floor(Math.random()*items.length)];
      const data = item.data && item.data[0] ? item.data[0] : null;
      if(!data || !data.nasa_id) throw new Error('no nasa id');

      // fetch asset list which contains actual image file links
      const assetUrl = `https://images-api.nasa.gov/asset/${encodeURIComponent(data.nasa_id)}`;
      const a = await fetch(assetUrl);
      if(!a.ok) throw new Error('asset fetch failed');
      const aj = await a.json();
      const assets = aj.collection && aj.collection.items ? aj.collection.items : [];
      const imageUrl = chooseBestImageFromAssets(assets);
      if(!imageUrl) throw new Error('no suitable image');

      // construct credits and link
      const title = data.title || 'nasa image';
      const center = data.center || 'NASA';
      const nasaViewUrl = (item.links && item.links[0] && item.links[0].href) ? item.links[0].href : `https://images.nasa.gov/details-${encodeURIComponent(data.nasa_id)}`;

      return { imageUrl, title, center, nasaViewUrl, nasa_id: data.nasa_id };
    }

    function cacheSet(obj){
      try {
        const record = { v: obj, t: Date.now() };
        localStorage.setItem(CACHE_KEY, JSON.stringify(record));
      } catch(e){}
    }
    function cacheGet(){
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        const parsed = tryParse(raw);
        if(!parsed || !parsed.v || !parsed.t) return null;
        if(Date.now() - parsed.t > CACHE_TTL_MS) return null;
        return parsed.v;
      } catch(e){ return null; }
    }

    // preload and apply background
    function applyBackground(imageUrl){
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        // set on html element (so background covers whole page)
        document.documentElement.style.backgroundImage = `url("${imageUrl}")`;
        document.documentElement.style.backgroundSize = 'cover';
        document.documentElement.style.backgroundPosition = 'center';
        document.documentElement.style.backgroundAttachment = 'fixed';
      };
      img.onerror = () => { /* keep default fallback */ };
      img.src = imageUrl;
    }

    // show credit badge
    function showCredit(meta){
      const badge = document.getElementById('nasaCredit');
      if(!badge) return;
      if(!meta || !meta.title) { badge.style.display = 'none'; return; }
      badge.textContent = `${meta.title} — ${meta.center || 'NASA'}`;
      badge.href = meta.nasaViewUrl || '#';
      badge.target = '_blank';
      badge.style.display = 'inline-block';
    }

    async function initBackground(){
      try {
        const cached = cacheGet();
        if(cached){
          applyBackground(cached.imageUrl);
          showCredit(cached);
          return;
        }

        // otherwise fetch a random image
        const meta = await fetchRandomNasaImage();
        if(meta && meta.imageUrl){
          cacheSet(meta);
          applyBackground(meta.imageUrl);
          showCredit(meta);
          return;
        }
      } catch(err){
        console.warn('nasa bg error', err);
        // fallback is the local image already in CSS
      }
    }

    // start (do not block other scripts)
    window.addEventListener('load', () => {
      initBackground();
    });
  })();

  /****************************************************************
   * end NASA background integration
   ****************************************************************/

  </script>
</body>
</html>
